<div class="page-head"><div class="container">
  <h1>Departments</h1>
  <p>Choose a department to see the degrees offered and intake.</p>
</div></div>
<section class="section container">
  <div class="grid">
    @for (d of departments; track d.name) {
      <article class="card">
        <span class="tag">{{ d.degree }}</span>
        <h3>{{ d.name }}</h3>
        <p>{{ d.about }}</p>
        <p><strong>{{ d.seats }}</strong> seats</p>
      </article>
    }
  </div>
</section>
